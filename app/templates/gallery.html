<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gallery</title>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .nav { padding: 20px; background: #667eea; color: white; display: flex; justify-content: space-between; align-items: center;}
        .btn { padding: 8px 16px; border-radius: 4px; text-decoration: none; color: white; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="nav">
        <h2>Gallery</h2>
        <div>
            <a href="{{ url_for('content.upload') }}" class="btn">Upload New</a>
            <a href="{{ url_for('main.dashboard') }}" class="btn">Dashboard</a>
        </div>
    </div>

    <div class="grid">
        {% for post in posts.items %}
        <div class="card">
            <img src="{{ url_for('static', filename='uploads/' + post.filename) }}" alt="{{ post.title }}">
            <div class="card-body">
                <h3>{{ post.title }}</h3>
                <p>By {{ post.author_username }}</p>
                <a href="{{ url_for('content.post_detail', post_id=post.id) }}">View & Comment</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
