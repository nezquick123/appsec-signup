<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('Success') }}</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="body-centered">
    <div class="container container-sm">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
        </div>
        
        <h1>{{ title | default('Success!') }}</h1>
        
        <p>{{ message | default('Operation completed successfully.') }}</p>
        
        <p class="secondary-text">
            {{ secondary_text | default("Didn't receive the email? Check your spam folder or contact support.") }}
        </p>
        
        <a class="view-link" href="{{ action_url | default(url_for('auth.login')) }}">
            {{ action_text | default('Go to Login') }}
        </a>
    </div>
</body>
</html>
